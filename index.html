<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plants Path Collective</title>
  <meta name="description" content="Plants Path Collective es un estudio indie chileno que crea juegos con mundos y personajes inolvidables. Seguí el desarrollo en nuestros devlogs.">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.imgur.com/hh2OL2D.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">  
  <link rel="stylesheet" href="css/styles.css"/>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Plants Path Collective">
  <meta property="og:description" content="Creamos juegos divertidos con mundos y personajes inolvidables.">
  <meta property="og:image" content="https://plants-path-collective.github.io/assets/misc/main-page.webp">
  <meta property="og:url" content="https://plants-path-collective.github.io/">
  <meta property="og:site_name" content="Plants Path Collective">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Plants Path Collective">
  <meta name="twitter:description" content="Creamos juegos divertidos con mundos y personajes inolvidables.">
  <meta name="twitter:image" content="https://plants-path-collective.github.io/assets/misc/main-page.webp">
</head>

  <body>
  
  <!-- NAVIGATION (hidden initially) -->
  <header class="nav hidden-nav">
    <div class="logo">
      <img src="./assets/misc/logo_nav.webp" alt="Plants Path Collective logo" class="nav-logo-img">
    </div>
  
    <div class="nav-icons"></div>
  </header>
  
    <main>
      
      <!-- HERO -->
      <section class="hero">
        
        <div class="hero-content">
          
          <div class="studio-logo">
            <img src="./assets/misc/logo_x3.webp" alt="Studio logo" class="hero-logo-img">
          </div>
          
          <p class="hero-description">Creamos juegos divertidos con mundos y personajes inolvidables.</p>
        
        </div>
        
      </section>
      
      <!-- NEWS (BLOG ENTRIES) -->
      <section id="news" class="section section-news">

        <div class="news-content">

          <div class="news-panel primary">
            <div id="devlog-list" class="devlog-list">
              <!-- Devlog entries injected by script.js -->
            </div>
          </div>

          <div class="news-panel secondary">

            <div class="devlog-search">
              <i class="fas fa-search"></i>
              <input type="text" id="devlog-search-input" placeholder="Search devlogs..." autocomplete="off">
            </div>

            <div id="devlog-filters" class="devlog-filters">
              <!-- Filter chips injected by script.js -->
            </div>

          </div>

        </div>

      </section>
      
      <!-- WORK (PROJECTS) -->
      <section id="work" class="section section-projects">
        
        <div id="projects" class="grid"></div>
        
      </section>
      
    </main>
  
    <!-- FOOTER -->
    <footer id="footer" class="site-footer">
      
      <div class="footer-icons"></div>
      
      <p class="copyright">© 2026 Plants Path Collective</p>
      
    </footer>
  
  </body>

<script src="js/script.js"></script>

</html>
