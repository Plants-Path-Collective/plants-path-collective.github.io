name: Build devlogs

# Runs the markdown -> HTML build whenever a devlog source file or the
# build script itself changes, then commits the generated output
# (devlog/*.html + data/devlogs.json) back to the branch.
#
# Note: this workflow only watches devlogs/** and scripts/** — NOT the
# generated files it produces. That's what stops it from re-triggering
# itself in an infinite loop when it commits.

on:
  push:
    branches: [main]
    paths:
      - "devlogs/**"
      - "scripts/**"
  workflow_dispatch: # lets you trigger it manually from the Actions tab

concurrency:
  group: build-devlogs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Build devlogs
        working-directory: scripts
        run: node build-devlogs.js

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild devlogs from markdown"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "devlog/*.html data/devlogs.json"
