<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{TITLE}} — Plants Path Collective</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/hh2OL2D.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css"/>
</head>

<body class="devlog-page" style="--page-bg-image: {{BACKGROUND_IMAGE_CSS}};">

  <main class="devlog-layout">

    <aside class="devlog-sidebar">
      <div class="devlog-author-card glass-panel">
        <div class="devlog-author-top">
          <img class="devlog-author-avatar" src="{{AUTHOR_AVATAR}}" alt="{{AUTHOR_NAME}}">
          <div>
            <div class="devlog-author-name">{{AUTHOR_NAME}}</div>
            <div class="devlog-author-role">{{AUTHOR_ROLE}}</div>
          </div>
        </div>
        <hr class="devlog-author-divider">
        <div class="devlog-date-uploaded">{{DATE_UPLOADED}}</div>
      </div>

      <a class="devlog-back-btn glass-panel" href="{{BACK_HREF}}">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </aside>

    <article class="devlog-main">

      <div class="devlog-title-panel glass-panel">
        <h1>{{TITLE}}</h1>
        <p class="devlog-game">{{GAME}}</p>
      </div>

      {{CONTENT}}

    </article>

  </main>

</body>

</html>
