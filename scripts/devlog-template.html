<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{TITLE}} — Plants Path Collective</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/hh2OL2D.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css"/>

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}} — Plants Path Collective">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:site_name" content="Plants Path Collective">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — Plants Path Collective">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  
</head>

<body class="devlog-page" style="--page-bg-image: {{BACKGROUND_IMAGE_CSS}};">

<main class="devlog-layout">

  <aside class="devlog-sidebar">
    <div class="devlog-author-card glass-panel {{AUTHOR_CARD_MODIFIER}}">
      {{AUTHORS}}
      <hr class="devlog-author-divider">
      <div class="devlog-date-uploaded">{{DATE_UPLOADED}}</div>
    </div>

    <a class="devlog-back-btn glass-panel" href="{{BACK_HREF}}">
      <i class="fas fa-arrow-left"></i> Regresar
    </a>
  </aside>

  <article class="devlog-main">

    <div class="devlog-title-panel glass-panel">
      <h1>{{TITLE}}</h1>
      <p class="devlog-game">{{GAME}}</p>
    </div>

    {{CONTENT}}

  </article>

</main>

</body>

</html>
